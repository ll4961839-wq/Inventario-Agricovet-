<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Agricovet de Guatemala - Inventario</title>
                <style>
                        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 15px; text-align: center; color: #333; }
                                .logo-container { margin-bottom: 20px; }
                                        .logo-container img { max-width: 150px; height: auto; }
                                                .contenedor { max-width: 100%; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); box-sizing: border-box; }
                                                        .inventario-container { max-width: 100%; margin: 0 auto; background: white; padding: 15px; border-radius: 10px; display: none; box-sizing: border-box; }
                                                                input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
                                                                        button { width: 100%; padding: 12px; background-color: #2c5e3b; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
                                                                                button:hover { background-color: #1e4229; }
                                                                                        .btn-accion { width: auto; padding: 8px 12px; font-size: 14px; margin: 2px; display: inline-block; }
                                                                                                .btn-quitar { background-color: #d9534f; }
                                                                                                        .link { color: #2c5e3b; cursor: pointer; text-decoration: underline; margin-top: 15px; display: block; font-size: 14px; }
                                                                                                                .error { color: red; font-size: 14px; display: none; margin-top: 10px; }
                                                                                                                        .exito { color: green; font-size: 14px; display: none; margin-top: 10px; }
                                                                                                                                #buscador { margin-bottom: 15px; border: 2px solid #2c5e3b; }
                                                                                                                                        .tabla-responsive { overflow-x: auto; margin-top: 15px; }
                                                                                                                                                table { width: 100%; border-collapse: collapse; min-width: 450px; }
                                                                                                                                                        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; vertical-align: middle; }
                                                                                                                                                                th { background-color: #e0ca9e; color: #333; }
                                                                                                                                                                        .img-producto { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; background-color: #f0f0f0; }
                                                                                                                                                                                .header-inv { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; align-items: center; }
                                                                                                                                                                                        .btn-salir { background-color: #666; width: 100%; }
                                                                                                                                                                                                #panel-admin { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
                                                                                                                                                                                                        #panel-admin h3 { margin-top: 0; color: #2c5e3b; font-size: 16px; }
                                                                                                                                                                                                            </style>
                                                                                                                                                                                                            </head>
                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                    <div class="logo-container">
                                                                                                                                                                                                                            <img src="agricovet.png" alt="Logo Agricovet" onerror="this.style.display='none'">
                                                                                                                                                                                                                                    <h1 style="color: #2c5e3b; margin-top: 10px; font-size: 24px;">Agricovet de Guatemala</h1>
                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                            <div id="panel-login" class="contenedor">
                                                                                                                                                                                                                                                    <h2>Iniciar Sesión</h2>
                                                                                                                                                                                                                                                            <input type="email" id="login-correo" placeholder="Correo electrónico" required auto-capitalize="none">
                                                                                                                                                                                                                                                                    <input type="password" id="login-pass" placeholder="Contraseña" required>
                                                                                                                                                                                                                                                                            <button onclick="iniciarSesion()">Entrar</button>
                                                                                                                                                                                                                                                                                    <p id="login-error" class="error">Correo o contraseña incorrectos.</p>
                                                                                                                                                                                                                                                                                            <span class="link" onclick="mostrarRegistro()">¿Nuevo en el equipo? Regístrate aquí</span>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                    <div id="panel-registro" class="contenedor" style="display: none;">
                                                                                                                                                                                                                                                                                                            <h2>Registrar Nuevo Usuario</h2>
                                                                                                                                                                                                                                                                                                                    <input type="email" id="reg-correo" placeholder="Correo electrónico" required auto-capitalize="none">
                                                                                                                                                                                                                                                                                                                            <input type="password" id="reg-pass" placeholder="Crear Contraseña" required>
                                                                                                                                                                                                                                                                                                                                    <button onclick="registrarUsuario()" style="background-color: #e0ca9e; color: black;">Registrar</button>
                                                                                                                                                                                                                                                                                                                                            <p id="reg-error" class="error">Por favor llena todos los campos.</p>
                                                                                                                                                                                                                                                                                                                                                    <p id="reg-exito" class="exito">¡Registrado! Ya puedes iniciar sesión.</p>
                                                                                                                                                                                                                                                                                                                                                            <span class="link" onclick="mostrarLogin()">Volver a Iniciar Sesión</span>
                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                    <div id="panel-inventario" class="inventario-container">
                                                                                                                                                                                                                                                                                                                                                                                <div class="header-inv">
                                                                                                                                                                                                                                                                                                                                                                                            <h2 style="margin: 0; color: #2c5e3b;">Control de Inventario</h2>
                                                                                                                                                                                                                                                                                                                                                                                                        <span style="font-size: 14px; color: #666;">Usuario: <strong id="usuario-activo"></strong></span>
                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="btn-salir btn-accion" onclick="cerrarSesion()">Cerrar Sesión</button>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="panel-admin" style="display: none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Agregar Nuevo Producto Extra</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="nuevo-nombre" placeholder="Nombre exacto del producto">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="agregarProducto()">Añadir al Catálogo</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="buscador" placeholder="🔍 Buscar producto por nombre..." onkeyup="filtrarTabla()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="tabla-responsive">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="contenedor-tabla"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const CORREO_ADMIN = "seseffff942@gmail.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const listaOficial = ["Legatus mixx 30 OD litro", "Leñador 16 EW galón", "Dimaxine 72 SL galon", "Terraquat 20 SL galón", "Terraquat 20 SL litro", "Anorak 60 EC litro", "Duplexone 20 SL litro", "Leñador 16 EW 1 litro", "Revolver 36 5 SL litro", "Kaindor plus 30 SC litro", "SEMENTHAL 30 4 SL Caneca", "Torban 30 4 SL Caneca", "Triatleta 30 EW litro", "Nicogol 4 OD LITRO", "Dimaxine 72 SL litro", "Semental 16,5 SL litro", "Cegar 15 SL litro", "Azotela Max 85", "PILOT 56G 48X3", "Podador 60 WG 10X10gr", "Lasonate 90 SP 100 gr", "Revolver 36 5 SL caneca", "Torban 30 4 SL litro", "Coriplus 10 gr", "Lombrifin 10 gr", "Oxiplus Vitaminado 10 gr", "Socofin BD 10gr", "Vita vet plus 10gr", "Chemiestress 10gr", "Tilosin plus 25 gr", "Oxiplus Vitaminado 25 gr", "Cori plus 100 gr", "Socofin BD 100 gr", "Vita vet Plus 100 gr", "Lombrifin 100 gr", "Oxiplus Vitaminado 100 gr", "Tilosin 10 ml", "Socofin drog 10 ml", "Tilosin 25 ml", "Socofin drog 25 ml", "Tilosin 100 ml", "Nexlabet LA 30.1-60kg", "Nexlabet LA 7.6-15kg", "Nexlabet LA 15-30kg", "Dexametasona 20 ml", "Curabichera 400 ml", "Vitel 100 gr", "Vitel 15 gr", "Multipack 26/52 150 gr", "Multipack 26 52 15 gr", "Trimsulfa plus 100 gr", "Trinsulfa Plus 15 gr", "Electrolitos y Vitaminas 100 gr", "Electrolitos y Vitaminas 20 gr", "Broximicina 100 gr", "Fulmisarn spray 60 ml", "Shampoo Pets 250ml", "Vermimax plus 100 Tabletas", "Jabón PET Gold Barra", "Simparica trio 20-40kg", "Simparica trio 10-20kg", "Simparica trio 5-10kg", "Broncowell 100 gr", "Oxyfarm con electrolitos 100 gr", "Caja oxyfarm 20 grs", "All Trompa 454 gr", "All Trompa 100 gr", "Oxyfarm inyectable 10 ml", "Oxyfarm inyectable 50ml", "Oxyfarm inyectable 100 ml", "Oxyfarm inyectable 250 ml", "Pujantex 250 ml", "Vita B12 con fósforo 250 ml", "Ferradox plus 100 ml", "Neocan 120ml", "Neocan 240ml", "Defender 10ml", "Defender 50 ml", "Defender 100 ml", "Ferradox plus 10 ml", "tigent 20 ml", "Tigent 100ml", "Proteizoo plus 20ml", "Proteizoo Plus 250ml", "Ganazoo DP 20ml", "Bioxil 7% 500ml", "Dipiron 500 30 ml", "Labimin 500 ml", "Iverplus La 10ml 1%", "Iverplus la 100 ml 1%", "Iverplus La 500ml 1%", "Iverplus 500 4%", "Farma-Tecnimicina 50ml", "Farma-tecnimicina 100ml", "Farma-tecnimicina LA 10ml", "Farma-tecnimicina LA 50ml", "Farma-tecnimicina LA 100ml", "Oxitetraciclina plus 250ml", "Oxitetraciclina plus 100 ml", "Oxitetraciclina plus 50ml", "Oxitetraciclina plus 10ml", "verrugan 20 ml", "verrugan plus 30 ml", "Oxitocina 10ml", "Ectogan Pipeta Spot on", "Ectogan pour On LITRO", "Borogluconato de calcio 250 ml", "Solumin 250ml", "Instavit 500ml", "Leche en polvo para Ternero", "Nuvan 1L", "Nuvan 100ml", "Rata Quilla Sb caja", "JB Matagusano", "Impacto spray 263 gr", "Jeringa 1 ml 100U", "Jeringa 3 ml 100U", "Jeringa 5 ml 100U", "Jeringa 10ml 100U", "Lannate 100 ml", "mirex 250 grs", "mirex 500 grs", "Broncobion maxx 30 ml", "Mielita Vip", "Anticion anticonceptivo", "Ccipermetrina 25 EC 100ml", "Ccipermetrina 25 EC 250", "Ccipermetrina 25 EC 500ml", "Ccipermetrina 25 EC 1LT", "CPF 2DP", "FOLIAR PLUS", "PIKUDO 20 SC"];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let usuariosDB = JSON.parse(localStorage.getItem('usuarios_agricovet_v2')) || {};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let inventarioDB = JSON.parse(localStorage.getItem('inventario_agricovet_oficial'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!inventarioDB || inventarioDB.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                inventarioDB = listaOficial.map(nombre => ({ nombre: nombre, stock: 0, foto: nombre + ".PNG" }));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem('inventario_agricovet_oficial', JSON.stringify(inventarioDB));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function mostrarRegistro() { document.getElementById('panel-login').style.display = 'none'; document.getElementById('panel-registro').style.display = 'block'; limpiarMensajes(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function mostrarLogin() { document.getElementById('panel-registro').style.display = 'none'; document.getElementById('panel-login').style.display = 'block'; limpiarMensajes(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function limpiarMensajes() { document.getElementById('login-error').style.display = 'none'; document.getElementById('reg-error').style.display = 'none'; document.getElementById('reg-exito').style.display = 'none'; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function registrarUsuario() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let correo = document.getElementById('reg-correo').value.toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let pass = document.getElementById('reg-pass').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (correo === "" || pass === "") { document.getElementById('reg-error').innerText = "Llena todos los campos."; document.getElementById('reg-error').style.display = 'block'; return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (usuariosDB[correo]) { document.getElementById('reg-error').innerText = "El correo ya está registrado."; document.getElementById('reg-error').style.display = 'block'; return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                usuariosDB[correo] = pass;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem('usuarios_agricovet_v2', JSON.stringify(usuariosDB));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('reg-error').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('reg-exito').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('reg-correo').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('reg-pass').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function iniciarSesion() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let correo = document.getElementById('login-correo').value.toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let pass = document.getElementById('login-pass').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (usuariosDB[correo] && usuariosDB[correo] === pass) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('panel-login').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('panel-inventario').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('usuario-activo').innerText = correo;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderizarTabla(correo);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('login-correo').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('login-pass').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('login-error').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else { document.getElementById('login-error').style.display = 'block'; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function cerrarSesion() { document.getElementById('panel-inventario').style.display = 'none'; document.getElementById('panel-login').style.display = 'block'; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderizarTabla(usuarioActual) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let esAdmin = (usuarioActual === CORREO_ADMIN);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('panel-admin').style.display = esAdmin ? 'block' : 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let htmlTabla = `<table id="tabla-inventario"><tr><th>Foto</th><th>Producto</th><th>Stock</th>${esAdmin ? '<th>Modificar</th>' : ''}</tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    inventarioDB.forEach((item, index) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let colorStock = item.stock > 0 ? 'black' : 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let txtStock = item.stock > 0 ? item.stock : 'Agotado';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let acciones = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (esAdmin) { acciones = `<td><button class="btn-accion" onclick="modificarStock(${index}, 1)" style="background-color: #28a745;">+1</button><button class="btn-accion" onclick="modificarStock(${index}, -1)" style="background-color: #ffc107; color: black;">-1</button></td>`; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    htmlTabla += `<tr class="fila-producto"><td><img class="img-producto" src="${item.foto}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' fill=\\'%23ccc\\' viewBox=\\'0 0 24 24\\'><path d=\\'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z\\'/></svg>'"></td><td style="text-align: left;"><strong>${item.nombre}</strong></td><td style="color: ${colorStock}; font-weight: bold; font-size: 18px;">${txtStock}</td>${acciones}</tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            htmlTabla += '</table>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('contenedor-tabla').innerHTML = htmlTabla;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function agregarProducto() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let nombre = document.getElementById('nuevo-nombre').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(!nombre) { alert("Escribe el nombre del producto."); return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            inventarioDB.push({ nombre: nombre, stock: 0, foto: nombre + ".PNG" });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('nuevo-nombre').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    guardarYRefrescar();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function modificarStock(index, cantidad) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                inventarioDB[index].stock += cantidad;
