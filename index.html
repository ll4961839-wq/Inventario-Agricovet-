<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricovet de Guatemala - Inventario</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
            color: #333; 
        }
        .logo-container { margin-bottom: 20px; }
        .logo-container img { max-width: 150px; height: auto; }
        
        /* Contenedor de Login/Registro */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: block;
        }
        
        .auth-container.hidden { display: none; }
        
        /* Contenedor de Inventario */
        .contenedor {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
        }
        
        .contenedor.visible { display: block; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #2c5e3b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover { background-color: #1e4229; }
        
        .btn-accion {
            width: auto;
            padding: 8px 12px;
            font-size: 12px;
            margin: 2px;
            display: inline-block;
        }
        
        .btn-quitar { background-color: #d9534f; }
        .btn-quitar:hover { background-color: #c9302c; }
        
        .link {
            color: #2c5e3b;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px;
            display: block;
            font-size: 14px;
        }
        
        .link:hover { color: #1e4229; }
        
        .error {
            color: #d9534f;
            font-size: 14px;
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 5px;
        }
        
        .error.visible { display: block; }
        
        .exito {
            color: #155724;
            font-size: 14px;
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 5px;
        }
        
        .exito.visible { display: block; }
        
        .info {
            color: #004085;
            font-size: 14px;
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #d1ecf1;
            border-radius: 5px;
        }
        
        .info.visible { display: block; }
        
        #buscador { 
            margin-bottom: 15px; 
            border: 2px solid #2c5e3b;
            max-width: 100%;
        }
        
        .tabla-responsive { 
            overflow-x: auto; 
            margin-top: 15px; 
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        
        th {
            background-color: #e0ca9e;
            color: #333;
            font-weight: bold;
        }
        
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f0f0f0; }
        
        .img-producto { 
            width: 60px; 
            height: 60px; 
            object-fit: cover;
            border-radius: 5px;
        }
        
        .header-inv {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn-salir {
            background-color: #d9534f;
            padding: 10px 20px;
            font-size: 14px;
            width: auto;
        }
        
        .btn-salir:hover { background-color: #c9302c; }
        
        #panel-agregar { 
            margin-bottom: 20px; 
            padding: 15px; 
            background-color: #f9f9f9; 
            border-radius: 5px; 
        }
        
        h1, h2 { color: #2c5e3b; }
        
        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        
        .verification-section {
            background-color: #f0f8f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .verification-section.visible { display: block; }
        
        .code-display {
            background-color: #2c5e3b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 5px;
        }

        .stock-input {
            width: 80px;
            padding: 6px;
            font-size: 14px;
        }

        #contenedor-tabla {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- SECCIÓN DE AUTENTICACIÓN -->
    <div class="auth-container" id="authContainer">
        <div class="logo-container">
            <h1>🌾 Agricovet</h1>
            <p>Sistema de Inventario Seguro</p>
        </div>
        
        <!-- Formulario de Registro -->
        <div id="registerForm">
            <h2>Crear Cuenta</h2>
            
            <div class="form-group">
                <label for="regEmail">📧 Correo Electrónico</label>
                <input type="email" id="regEmail" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="regPassword">🔐 Contraseña</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <div class="form-group">
                <label for="regPassword2">🔐 Confirmar Contraseña</label>
                <input type="password" id="regPassword2" placeholder="Repite tu contraseña" required>
            </div>
            
            <button onclick="registrarse()">Registrarse</button>
            
            <div class="error" id="regError"></div>
            <div class="exito" id="regSuccess"></div>
            <div class="info" id="regInfo"></div>
            
            <!-- Sección de Verificación -->
            <div class="verification-section" id="verificationSection">
                <h3>✅ Verificación de Correo</h3>
                <p>Se ha enviado un código a tu correo. Ingresalo aquí:</p>
                
                <div class="form-group">
                    <label for="verificationCode">Código de Verificación</label>
                    <input type="text" id="verificationCode" placeholder="Ej: 123456" maxlength="6">
                </div>
                
                <div class="code-display" id="generatedCode" style="display: none;"></div>
                
                <button onclick="verificarCodigo()">Verificar Código</button>
                <button onclick="reenviarCodigo()" style="background-color: #6c757d; margin-top: 5px;">Reenviar Código</button>
                
                <div class="error" id="verError"></div>
                <div class="exito" id="verSuccess"></div>
            </div>
            
            <span class="link" onclick="mostrarLogin()">¿Ya tienes cuenta? Inicia sesión</span>
        </div>
        
        <!-- Formulario de Login -->
        <div id="loginForm" style="display: none;">
            <h2>Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="logEmail">📧 Correo Electrónico</label>
                <input type="email" id="logEmail" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="logPassword">🔐 Contraseña</label>
                <input type="password" id="logPassword" placeholder="Tu contraseña" required>
            </div>
            
            <button onclick="iniciarSesion()">Iniciar Sesión</button>
            
            <div class="error" id="logError"></div>
            
            <span class="link" onclick="mostrarRegistro()">¿No tienes cuenta? Regístrate</span>
        </div>
    </div>
    
    <!-- SECCIÓN DE INVENTARIO -->
    <div class="contenedor" id="inventarioContainer">
        <div class="header-inv">
            <h1>📦 Inventario de Agricovet</h1>
            <button class="btn-salir" onclick="cerrarSesion()">🚪 Salir</button>
        </div>
        
        <input type="text" id="buscador" placeholder="🔍 Buscar productos...">
        
        <div class="tabla-responsive">
            <div id="contenedor-tabla"></div>
        </div>
    </div>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        let usuarioActual = null;
        let codigoVerificacionGenerado = null;
        let registroEnProceso = null;
        let inventarioDB = [];
        
        const STORAGE_KEY = 'usuarios_agricovet';
        const SESSION_KEY = 'sesion_agricovet';
        const INVENTARIO_KEY = 'inventario_agricovet_oficial';
        
        // Lista oficial de 164 productos
        const listaOficial = [
            "Legatus mixx 30 OD litro", "Leñador 16 EW galón", "Dimaxine 72 SL galon", "Terraquat 20 SL galón", 
            "Terraquat 20 SL litro", "Anorak 60 EC litro", "Duplexone 20 SL litro", "Leñador 16 EW 1 litro", 
            "Revolver 36 5 SL litro", "Kaindor plus 30 SC litro", "SEMENTHAL 30 4 SL Caneca", "Torban 30 4 SL Caneca", 
            "Triatleta 30 EW litro", "Nicogol 4 OD LITRO", "Dimaxine 72 SL litro", "Semental 16,5 SL litro", 
            "Cegar 15 SL litro", "Azotela Max 85", "PILOT 56G 48X3", "Podador 60 WG 10X10gr", 
            "Lasonate 90 SP 100 gr", "Revolver 36 5 SL caneca", "Torban 30 4 SL litro", "Coriplus 10 gr", 
            "Lombrifin 10 gr", "Oxiplus Vitaminado 10 gr", "Socofin BD 10gr", "Vita vet plus 10gr", 
            "Chemiestress 10gr", "Tilosin plus 25 gr", "Oxiplus Vitaminado 25 gr", "Cori plus 100 gr", 
            "Socofin BD 100 gr", "Vita vet Plus 100 gr", "Lombrifin 100 gr", "Oxiplus Vitaminado 100 gr", 
            "Tilosin 10 ml", "Socofin drog 10 ml", "Tilosin 25 ml", "Socofin drog 25 ml", 
            "Tilosin 100 ml", "Nexlabet LA 30.1-60kg", "Nexlabet LA 7.6-15kg", "Nexlabet LA 15-30kg", 
            "Dexametasona 20 ml", "Curabichera 400 ml", "Vitel 100 gr", "Vitel 15 gr", 
            "Multipack 26/52 150 gr", "Multipack 26 52 15 gr", "Trimsulfa plus 100 gr", "Trinsulfa Plus 15 gr", 
            "Electrolitos y Vitaminas 100 gr", "Electrolitos y Vitaminas 20 gr", "Broximicina 100 gr", "Fulmisarn spray 60 ml", 
            "Shampoo Pets 250ml", "Vermimax plus 100 Tabletas", "Jabón PET Gold Barra", "Simparica trio 20-40kg", 
            "Simparica trio 10-20kg", "Simparica trio 5-10kg", "Broncowell 100 gr", "Oxyfarm con electrolitos 100 gr", 
            "Caja oxyfarm 20 grs", "All Trompa 454 gr", "All Trompa 100 gr", "Oxyfarm inyectable 10 ml", 
            "Oxyfarm inyectable 50ml", "Oxyfarm inyectable 100 ml", "Oxyfarm inyectable 250 ml", "Pujantex 250 ml", 
            "Vita B12 con fósforo 250 ml", "Ferradox plus 100 ml", "Neocan 120ml", "Neocan 240ml", 
            "Defender 10ml", "Defender 50 ml", "Defender 100 ml", "Ferradox plus 10 ml", 
            "tigent 20 ml", "Tigent 100ml", "Proteizoo plus 20ml", "Proteizoo Plus 250ml", 
            "Ganazoo DP 20ml", "Bioxil 7% 500ml", "Dipiron 500 30 ml", "Labimin 500 ml", 
            "Iverplus La 10ml 1%", "Iverplus la 100 ml 1%", "Iverplus La 500ml 1%", "Iverplus 500 4%", 
            "Farma-Tecnimicina 50ml", "Farma-tecnimicina 100ml", "Farma-tecnimicina LA 10ml", "Farma-tecnimicina LA 50ml", 
            "Farma-tecnimicina LA 100ml", "Oxitetraciclina plus 250ml", "Oxitetraciclina plus 100 ml", "Oxitetraciclina plus 50ml", 
            "Oxitetraciclina plus 10ml", "verrugan 20 ml", "verrugan plus 30 ml", "Oxitocina 10ml", 
            "Ectogan Pipeta Spot on", "Ectogan pour On LITRO", "Borogluconato de calcio 250 ml", "Solumin 250ml", 
            "Instavit 500ml", "Leche en polvo para Ternero", "Nuvan 1L", "Nuvan 100ml", 
            "Rata Quilla Sb caja", "JB Matagusano", "Impacto spray 263 gr", "Jeringa 1 ml 100U", 
            "Jeringa 3 ml 100U", "Jeringa 5 ml 100U", "Jeringa 10ml 100U", "Lannate 100 ml", 
            "mirex 250 grs", "mirex 500 grs", "Broncobion maxx 30 ml", "Mielita Vip", 
            "Anticion anticonceptivo", "Ccipermetrina 25 EC 100ml", "Ccipermetrina 25 EC 250", "Ccipermetrina 25 EC 500ml", 
            "Ccipermetrina 25 EC 1LT", "CPF 2DP", "FOLIAR PLUS", "PIKUDO 20 SC"
        ];
        
        // ==================== INICIALIZACIÓN ====================
        window.addEventListener('DOMContentLoaded', function() {
            cargarUsuarios();
            verificarSesion();
            inicializarInventario();
            inicializarBuscador();
        });
        
        // ==================== INVENTARIO ====================
        
        function inicializarInventario() {
            let datos = localStorage.getItem(INVENTARIO_KEY);
            if (!datos) {
                inventarioDB = listaOficial.map(nombre => ({
                    nombre: nombre,
                    stock: 0,
                    foto: "imagenes/" + nombre.replace(/\s+/g, '_') + ".PNG"
                }));
                localStorage.setItem(INVENTARIO_KEY, JSON.stringify(inventarioDB));
            } else {
                inventarioDB = JSON.parse(datos);
            }
        }
        
        function renderizarTabla(filtro = "") {
            let html = '<table><thead><tr><th>Imagen</th><th>Producto</th><th>Stock</th><th>Acciones</th></tr></thead><tbody>';
            
            inventarioDB.forEach((p, index) => {
                if(p.nombre.toLowerCase().includes(filtro.toLowerCase())) {
                    html += `<tr>
                        <td><img src="${p.foto}" class="img-producto" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect fill=%22%23ddd%22 width=%2260%22 height=%2260%22/%3E%3Ctext x=%2230%22 y=%2230%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-family=%22Arial%22 font-size=%2214%22%3EN/A%3C/text%3E%3C/svg%3E'"></td>
                        <td>${p.nombre}</td>
                        <td><input type="number" class="stock-input" value="${p.stock}" onchange="actualizarStock(${index}, this.value)"></td>
                        <td>
                            <button class="btn-accion" onclick="guardarCambios()">💾 Guardar</button>
                            <button class="btn-accion btn-quitar" onclick="resetearStock(${index})">🔄 Resetear</button>
                        </td>
                    </tr>`;
                }
            });
            html += '</tbody></table>';
            document.getElementById('contenedor-tabla').innerHTML = html;
        }
        
        function actualizarStock(index, valor) {
            inventarioDB[index].stock = parseInt(valor) || 0;
        }
        
        function resetearStock(index) {
            if (confirm('¿Resetear stock a 0?')) {
                inventarioDB[index].stock = 0;
                renderizarTabla(document.getElementById('buscador').value);
                guardarCambios();
            }
        }
        
        function guardarCambios() {
            localStorage.setItem(INVENTARIO_KEY, JSON.stringify(inventarioDB));
            alert('✅ Cambios guardados exitosamente');
        }
        
        function inicializarBuscador() {
            document.getElementById('buscador').addEventListener('keyup', function(e) {
                renderizarTabla(e.target.value);
            });
        }
        
        // ==================== AUTENTICACIÓN ====================
        
        function mostrarRegistro() {
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            limpiarMensajes();
        }
        
        function mostrarLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            limpiarMensajes();
        }
        
        function registrarse() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            const regError = document.getElementById('regError');
            const regSuccess = document.getElementById('regSuccess');
            const regInfo = document.getElementById('regInfo');
            
            regError.classList.remove('visible');
            regSuccess.classList.remove('visible');
            regInfo.classList.remove('visible');
            
            if (!email || !password || !password2) {
                mostrarError(regError, 'Por favor completa todos los campos');
                return;
            }
            
            if (!validarEmail(email)) {
                mostrarError(regError, 'Por favor ingresa un correo válido');
                return;
            }
            
            if (password.length < 6) {
                mostrarError(regError, 'La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            if (password !== password2) {
                mostrarError(regError, 'Las contraseñas no coinciden');
                return;
            }
            
            const usuarios = cargarUsuarios();
            if (usuarios.some(u => u.email === email)) {
                mostrarError(regError, 'Este correo ya está registrado');
                return;
            }
            
            codigoVerificacionGenerado = generarCodigoVerificacion();
            registroEnProceso = {
                email: email,
                password: encriptarPassword(password),
                codigoVerificacion: codigoVerificacionGenerado
            };
            
            document.getElementById('verificationSection').classList.add('visible');
            document.getElementById('generatedCode').textContent = codigoVerificacionGenerado;
            document.getElementById('generatedCode').style.display = 'block';
            
            mostrarInfo(regInfo, `✅ Código generado: ${codigoVerificacionGenerado} (También se envió a tu correo)`);
            
            enviarCorreoVerificacion(email, codigoVerificacionGenerado);
        }
        
        function verificarCodigo() {
            const codigoIngresado = document.getElementById('verificationCode').value.trim();
            const verError = document.getElementById('verError');
            const verSuccess = document.getElementById('verSuccess');
            
            verError.classList.remove('visible');
            verSuccess.classList.remove('visible');
            
            if (!codigoIngresado) {
                mostrarError(verError, 'Por favor ingresa el código de verificación');
                return;
            }
            
            if (codigoIngresado !== codigoVerificacionGenerado.toString()) {
                mostrarError(verError, 'Código incorrecto. Intenta de nuevo.');
                return;
            }
            
            const usuarios = cargarUsuarios();
            usuarios.push({
                email: registroEnProceso.email,
                password: registroEnProceso.password,
                verificado: true,
                fechaRegistro: new Date().toISOString()
            });
            
            guardarUsuarios(usuarios);
            
            mostrarSuccess(verSuccess, '✅ ¡Cuenta creada exitosamente! Iniciando sesión...');
            
            setTimeout(() => {
                iniciarSesionDirecta(registroEnProceso.email);
            }, 1500);
        }
        
        function reenviarCodigo() {
            const email = registroEnProceso.email;
            const verInfo = document.getElementById('verError');
            
            enviarCorreoVerificacion(email, codigoVerificacionGenerado);
            
            verInfo.textContent = '📧 Código reenviado a tu correo';
            verInfo.className = 'info visible';
            
            setTimeout(() => {
                verInfo.classList.remove('visible');
            }, 3000);
        }
        
        function enviarCorreoVerificacion(email, codigo) {
            const formData = new FormData();
            formData.append('email', email);
            formData.append('codigo', codigo);
            formData.append('asunto', 'Código de Verificación - Agricovet');
            formData.append('mensaje', `Tu código de verificación es: ${codigo}`);
            
            fetch('https://formspree.io/f/myzpjyqb', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                },
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    console.log('✅ Correo enviado exitosamente a', email);
                } else {
                    console.log('⚠️ El correo se procesó localmente (modo demo)');
                }
            })
            .catch(error => {
                console.log('ℹ️ Funcionando en modo local. Código mostrado en pantalla.');
            });
        }
        
        function iniciarSesion() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPassword').value;
            const logError = document.getElementById('logError');
            
            logError.classList.remove('visible');
            
            if (!email || !password) {
                mostrarError(logError, 'Por favor completa todos los campos');
                return;
            }
            
            const usuarios = cargarUsuarios();
            const usuario = usuarios.find(u => u.email === email);
            
            if (!usuario) {
                mostrarError(logError, 'Correo o contraseña incorrectos');
                return;
            }
            
            if (!usuario.verificado) {
                mostrarError(logError, 'Por favor verifica tu correo primero');
                return;
            }
            
            if (!desencriptarPassword(password, usuario.password)) {
                mostrarError(logError, 'Correo o contraseña incorrectos');
                return;
            }
            
            iniciarSesionDirecta(email);
        }
        
        function iniciarSesionDirecta(email) {
            usuarioActual = email;
            sessionStorage.setItem(SESSION_KEY, email);
            
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('inventarioContainer').classList.add('visible');
            
            renderizarTabla();
        }
        
        function cerrarSesion() {
            if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
                usuarioActual = null;
                sessionStorage.removeItem(SESSION_KEY);
                
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('inventarioContainer').classList.remove('visible');
                
                mostrarRegistro();
                limpiarFormularios();
                limpiarMensajes();
            }
        }
        
        function verificarSesion() {
            const emailGuardado = sessionStorage.getItem(SESSION_KEY);
            if (emailGuardado) {
                usuarioActual = emailGuardado;
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('inventarioContainer').classList.add('visible');
                renderizarTabla();
            }
        }
        
        // ==================== UTILIDADES ====================
        
        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
        
        function generarCodigoVerificacion() {
            return Math.floor(100000 + Math.random() * 900000);
        }
        
        function encriptarPassword(password) {
            return btoa(password);
        }
        
        function desencriptarPassword(password, passwordEncriptada) {
            return btoa(password) === passwordEncriptada;
        }
        
        function mostrarError(elemento, mensaje) {
            elemento.textContent = mensaje;
            elemento.classList.add('visible');
        }
        
        function mostrarSuccess(elemento, mensaje) {
            elemento.textContent = mensaje;
            elemento.classList.add('visible');
        }
        
        function mostrarInfo(elemento, mensaje) {
            elemento.textContent = mensaje;
            elemento.classList.add('visible');
        }
        
        function limpiarMensajes() {
            document.querySelectorAll('.error, .exito, .info').forEach(el => {
                el.classList.remove('visible');
            });
        }
        
        function limpiarFormularios() {
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPassword2').value = '';

        // ==================== ALMACENAMIENTO ====================
        
        function cargarUsuarios() {
            const datos = localStorage.getItem(STORAGE_KEY);
            return datos ? JSON.parse(datos) : [];
        }
        
        function guardarUsuarios(usuarios) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(usuarios));
        }
    </script>
